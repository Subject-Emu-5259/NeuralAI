name: Sync to Hugging Face

on:
  push:
    branches: [master]
  workflow_dispatch:  # allow manual trigger from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install -q huggingface_hub

      - name: Upload LoRA adapter to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: "Subject-Emu-5259/NeuralAI"
          ADAPTER_SRC: "checkpoints/v2_model"
        run: |
          set -e
          # NOTE: GitHub is the single source of truth for CODE.
          # We do NOT push the whole repo to HF (it contains >1GB of
          # checkpoints/nextcloud files that exceed HF's 10 MiB non-LFS limit).
          # Instead we upload ONLY the LoRA adapter that the Gradio demo
          # (Subject-Emu-5259/NeuralAI) loads via snapshot_download.
          echo "Uploading LoRA adapter from $ADAPTER_SRC to $HF_REPO_ID"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          src = os.environ["ADAPTER_SRC"]
          repo = os.environ["HF_REPO_ID"]

          # 1) ALWAYS push the model card / README first (small, critical).
          #    This prevents the card from ever reverting to the default template.
          card = os.path.join(src, "README.md")
          if os.path.exists(card):
              api.upload_file(
                  path_or_fileobj=card,
                  path_in_repo="README.md",
                  repo_id=repo,
                  repo_type="model",
                  commit_message="Sync model card (README.md)",
              )
              print("  uploaded README.md (model card)")

          # 2) Push the remaining small adapter files (config + tokenizer + json).
          small = (".json", ".bin", ".jinja", ".txt")
          for root, _, files in os.walk(src):
              for f in files:
                  if f.endswith(small):
                      local = os.path.join(root, f)
                      api.upload_file(
                          path_or_fileobj=local,
                          path_in_repo=f,
                          repo_id=repo,
                          repo_type="model",
                          commit_message=f"Sync LoRA adapter: {f}",
                      )
                      print(f"  uploaded {f}")

          # 3) Attempt the large .safetensors weights LAST, in its own try so a
          #    size/limit failure does not roll back the card + config above.
          weights = [os.path.join(root, f)
                     for root, _, files in os.walk(src)
                     for f in files if f.endswith(".safetensors")]
          for local in weights:
              try:
                  api.upload_file(
                      path_or_fileobj=local,
                      path_in_repo=os.path.basename(local),
                      repo_id=repo,
                      repo_type="model",
                      commit_message=f"Sync LoRA weights: {os.path.basename(local)}",
                  )
                  print(f"  uploaded {os.path.basename(local)}")
              except Exception as e:
                  print(f"  ⚠️ skipped weights {local}: {e}")

          print("✅ Adapter sync to Hugging Face complete")
          PY
