name: Sync to Hugging Face

on:
  push:
    branches: [master]
  workflow_dispatch:  # allow manual trigger from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Configure git
        run: |
          git config --global user.email "deandrewh26@gmail.com"
          git config --global user.name "Subject-Emu-5259"

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          # NOTE: GitHub is the single source of truth. This pushes the
          # WHOLE repo (code + the tracked `adapter/` LoRA weights) to
          # Subject-Emu-5259/NeuralAI, which the Render demo reads from.
          HF_REPO_ID="Subject-Emu-5259/NeuralAI"
          echo "Pushing to Hugging Face repo: $HF_REPO_ID"
          # Use the token in the remote URL for auth
          HF_URL="https://Subject-Emu-5259:${HF_TOKEN}@huggingface.co/${HF_REPO_ID}"
          git remote add hf "$HF_URL" 2>/dev/null || git remote set-url hf "$HF_URL"
          # Push master -> main on the Hub, force to keep them identical
          GIT_LFS_SKIP_SMUDGE=1 git push hf "HEAD:refs/heads/main" --force
          echo "✅ Sync to Hugging Face complete"
