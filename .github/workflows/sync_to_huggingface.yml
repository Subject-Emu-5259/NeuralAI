name: Sync to Hugging Face

on:
  push:
    branches: [master]
  workflow_dispatch:  # allow manual trigger from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "deandrewh26@gmail.com"
          git config --global user.name "Subject-Emu-5259"

          # Configure git to use the HF token for auth
          git config --global url."https://Subject-Emu-5259:${HF_TOKEN}@huggingface.co".insteadOf "https://huggingface.co"

          # Add HF repo as a remote and push the whole repo (all branches + tags)
          HF_REPO="https://huggingface.co/${HF_REPO_ID}"
          git remote add hf "$HF_REPO" || git remote set-url hf "$HF_REPO"
          git push hf HEAD:main --force
        env:
          HF_REPO_ID: Subject-Emu-5259/NeuralAI
