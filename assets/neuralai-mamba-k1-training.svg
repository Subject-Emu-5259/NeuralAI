<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="900" height="260" fill="url(#bg)" rx="16"/>
  <text x="450" y="42" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">NeuralAI Mamba K1 Training Pipeline</text>

  <!-- Boxes -->
  <rect x="50" y="80" width="180" height="110" rx="12" fill="url(#box1)" stroke="#475569" stroke-width="1"/>
  <text x="140" y="112" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Base Model</text>
  <text x="140" y="140" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#cbd5e1">state-spaces/</text>
  <text x="140" y="158" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#cbd5e1">mamba-130m-hf</text>
  <text x="140" y="182" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94a3b8">Mamba SSM · 130M</text>

  <rect x="300" y="80" width="210" height="110" rx="12" fill="url(#box2)" stroke="#0369a1" stroke-width="1"/>
  <text x="405" y="112" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#f0f9ff">NeuralAI SFT</text>
  <text x="405" y="140" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#e0f2fe">LoRA r=16, α=32</text>
  <text x="405" y="158" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#e0f2fe">Assistant-style seed set</text>
  <text x="405" y="182" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#bae6fd">3 epochs · chat format</text>

  <rect x="570" y="80" width="210" height="110" rx="12" fill="url(#box3)" stroke="#15803d" stroke-width="1"/>
  <text x="675" y="112" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#f0fdf4">Merged &amp; Quantized</text>
  <text x="675" y="140" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#dcfce7">LoRA merged into base</text>
  <text x="675" y="158" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#dcfce7">GGUF Q4_K_M / F16</text>
  <text x="675" y="182" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#bbf7d0">~86 MB · edge-ready</text>

  <!-- Arrows -->
  <line x1="235" y1="135" x2="290" y2="135" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="515" y1="135" x2="565" y2="135" stroke="#64748b" stroke-width="3" marker-end="url(#arrowhead)"/>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <text x="450" y="230" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#94a3b8">Owned weights · local inference · llama.cpp / LM Studio compatible</text>
</svg>