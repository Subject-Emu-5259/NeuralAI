<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1400" height="700" fill="url(#bg)" rx="12"/>
  <text x="700" y="50" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="700" fill="#f8fafc" text-anchor="middle">NeuralAI Active Model Lineup</text>
  <text x="700" y="80" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Two production tracks: owned Mamba SSM base + awareness-tuned Transformer assistant</text>

  <g transform="translate(80, 120)">
    <rect width="560" height="510" fill="#0f172a" stroke="#22d3ee" stroke-width="2" rx="16" filter="url(#shadow)"/>
    <text x="280" y="45" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#22d3ee" text-anchor="middle">Mamba K1</text>
    <text x="280" y="70" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">NeuralAI's First Owned Base Model</text>

    <text x="40" y="125" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#cbd5e1"><tspan font-weight="600" fill="#22d3ee">Architecture:</tspan> Mamba SSM (State Space Model)</text>
    <text x="40" y="160" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#cbd5e1"><tspan font-weight="600" fill="#22d3ee">Parameters:</tspan> 130 million</text>
    <text x="40" y="195" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#cbd5e1"><tspan font-weight="600" fill="#22d3ee">Base:</tspan> state-spaces/mamba-130m-hf</text>
    <text x="40" y="230" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#cbd5e1"><tspan font-weight="600" fill="#22d3ee">Training:</tspan> LoRA SFT on instruction/seed data</text>
    <text x="40" y="265" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#cbd5e1"><tspan font-weight="600" fill="#22d3ee">Format:</tspan> Safetensors + Q4_K_M GGUF</text>
    <text x="40" y="300" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#cbd5e1"><tspan font-weight="600" fill="#22d3ee">Complexity:</tspan> O(n) linear scaling</text>
    <text x="40" y="335" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#cbd5e1"><tspan font-weight="600" fill="#22d3ee">Status:</tspan> R&amp;D — chat training in progress</text>
    <text x="40" y="370" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#cbd5e1"><tspan font-weight="600" fill="#22d3ee">Role:</tspan> Foundation of NeuralAI model sovereignty</text>

    <rect x="40" y="410" width="480" height="64" fill="#164e63" rx="8"/>
    <text x="280" y="435" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#cffafe" text-anchor="middle">Why it matters: full weight ownership, no attention</text>
    <text x="280" y="457" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#cffafe" text-anchor="middle">quadratic cost, built for long-context inference.</text>
  </g>

  <g transform="translate(760, 120)">
    <rect width="560" height="510" fill="#0f172a" stroke="#fbbf24" stroke-width="2" rx="16" filter="url(#shadow)"/>
    <text x="280" y="45" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#fbbf24" text-anchor="middle">NeuralAI × SmolLM2-360M</text>
    <text x="280" y="70" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Awareness-Tuned Production Chat Backend</text>

    <text x="40" y="125" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#cbd5e1"><tspan font-weight="600" fill="#fbbf24">Architecture:</tspan> Transformer decoder + LoRA</text>
    <text x="40" y="160" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#cbd5e1"><tspan font-weight="600" fill="#fbbf24">Parameters:</tspan> 360 million</text>
    <text x="40" y="195" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#cbd5e1"><tspan font-weight="600" fill="#fbbf24">Base:</tspan> HuggingFaceTB/SmolLM2-360M-Instruct</text>
    <text x="40" y="230" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#cbd5e1"><tspan font-weight="600" fill="#fbbf24">Training:</tspan> LoRA SFT on NeuralAI awareness data</text>
    <text x="40" y="265" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#cbd5e1"><tspan font-weight="600" fill="#fbbf24">Format:</tspan> LoRA adapter + merged GGUF (Q8_0)</text>
    <text x="40" y="300" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#cbd5e1"><tspan font-weight="600" fill="#fbbf24">Dataset:</tspan> 83 → 506 prompt/response pairs</text>
    <text x="40" y="335" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#cbd5e1"><tspan font-weight="600" fill="#fbbf24">Status:</tspan> Live — active inference backend</text>
    <text x="40" y="370" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#cbd5e1"><tspan font-weight="600" fill="#fbbf24">Role:</tspan> Branded conversational assistant</text>

    <rect x="40" y="410" width="480" height="64" fill="#713f12" rx="8"/>
    <text x="280" y="435" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#fde68a" text-anchor="middle">Why it matters: teaches a small, efficient chat model</text>
    <text x="280" y="457" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#fde68a" text-anchor="middle">NeuralAI identity, site facts, companion tone, and boundaries.</text>
  </g>

  <path d="M 640 375 L 760 375" stroke="#475569" stroke-width="3" stroke-dasharray="10,6"/>
  <polygon points="750,365 760,375 750,385" fill="#475569"/>
</svg>