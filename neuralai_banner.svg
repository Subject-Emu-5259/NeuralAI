<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>

  <!-- LEFT SIDE: Neural Network Visualization -->
  <!-- Layer 1 (Input) - Left -->
  <circle cx="80" cy="100" r="12" fill="#22d3ee" filter="url(#softGlow)"/>
  <circle cx="80" cy="200" r="12" fill="#22d3ee" filter="url(#softGlow)"/>
  <circle cx="80" cy="300" r="12" fill="#22d3ee" filter="url(#softGlow)"/>

  <!-- Layer 2 (Hidden) - Middle-left -->
  <circle cx="200" cy="80" r="14" fill="#7c3aed" filter="url(#softGlow)"/>
  <circle cx="200" cy="160" r="14" fill="#7c3aed" filter="url(#softGlow)"/>
  <circle cx="200" cy="240" r="14" fill="#7c3aed" filter="url(#softGlow)"/>
  <circle cx="200" cy="320" r="14" fill="#7c3aed" filter="url(#softGlow)"/>

  <!-- Layer 3 (Hidden) - Middle-right -->
  <circle cx="320" cy="120" r="14" fill="#7c3aed" filter="url(#softGlow)"/>
  <circle cx="320" cy="200" r="14" fill="#7c3aed" filter="url(#softGlow)"/>
  <circle cx="320" cy="280" r="14" fill="#7c3aed" filter="url(#softGlow)"/>

  <!-- Terminal Icon Layer -->
  <g transform="translate(420, 120)">
    <rect x="0" y="0" width="40" height="40" rx="4" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <line x1="5" y1="10" x2="35" y2="10" stroke="#22d3ee" stroke-width="1.5"/>
    <line x1="5" y1="18" x2="20" y2="18" stroke="#7c3aed" stroke-width="1.5"/>
    <line x1="5" y1="26" x2="25" y2="26" stroke="#7c3aed" stroke-width="1.5"/>
    <line x1="5" y1="34" x2="15" y2="34" stroke="#22d3ee" stroke-width="1.5"/>
  </g>

  <!-- Document Icon Layer -->
  <g transform="translate(420, 260)">
    <rect x="5" y="0" width="30" height="40" rx="2" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <line x1="5" y1="8" x2="35" y2="8" stroke="#7c3aed" stroke-width="1.5"/>
    <line x1="5" y1="16" x2="35" y2="16" stroke="#7c3aed" stroke-width="1.5"/>
    <line x1="5" y1="24" x2="30" y2="24" stroke="#7c3aed" stroke-width="1.5"/>
    <line x1="5" y1="32" x2="25" y2="32" stroke="#7c3aed" stroke-width="1.5"/>
  </g>

  <!-- Connecting lines from Layer 1 to Layer 2 -->
  <line x1="92" y1="100" x2="186" y2="80" stroke="#7c3aed" stroke-width="1.5" opacity="0.6"/>
  <line x1="92" y1="100" x2="186" y2="160" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
  <line x1="92" y1="200" x2="186" y2="160" stroke="#7c3aed" stroke-width="1.5" opacity="0.6"/>
  <line x1="92" y1="200" x2="186" y2="240" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
  <line x1="92" y1="300" x2="186" y2="240" stroke="#7c3aed" stroke-width="1.5" opacity="0.6"/>
  <line x1="92" y1="300" x2="186" y2="320" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>

  <!-- Connecting lines from Layer 2 to Layer 3 -->
  <line x1="214" y1="80" x2="306" y2="120" stroke="#7c3aed" stroke-width="1.5" opacity="0.6"/>
  <line x1="214" y1="160" x2="306" y2="120" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
  <line x1="214" y1="160" x2="306" y2="200" stroke="#7c3aed" stroke-width="1.5" opacity="0.6"/>
  <line x1="214" y1="240" x2="306" y2="200" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
  <line x1="214" y1="240" x2="306" y2="280" stroke="#7c3aed" stroke-width="1.5" opacity="0.6"/>
  <line x1="214" y1="320" x2="306" y2="280" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>

  <!-- Connecting lines from Layer 3 to Icons -->
  <line x1="334" y1="120" x2="420" y2="140" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>
  <line x1="334" y1="200" x2="420" y2="200" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
  <line x1="334" y1="280" x2="420" y2="280" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>

  <!-- Vertical divider line -->
  <line x1="550" y1="50" x2="550" y2="350" stroke="#7c3aed" stroke-width="2" opacity="0.3"/>

  <!-- RIGHT SIDE: Branding -->
  <!-- Main Title -->
  <text x="850" y="120" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#purpleGlow)" letter-spacing="2">
    NeuralAI
  </text>

  <!-- Tagline subtitle -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#22d3ee" letter-spacing="1">
    RAG • Terminal • Neural Uplink
  </text>

  <!-- Main tagline -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#e2e8f0" letter-spacing="0.5">
    Your AI. On your hardware. In your browser.
  </text>

  <!-- Accent dots -->
  <circle cx="600" cy="330" r="4" fill="#7c3aed"/>
  <circle cx="620" cy="330" r="4" fill="#22d3ee"/>
  <circle cx="640" cy="330" r="4" fill="#7c3aed"/>
  <circle cx="660" cy="330" r="4" fill="#22d3ee"/>
</svg>