# NeuralAI-Air-135M DPO v19 Configuration

model:
  base_model_path: "checkpoints/sft-v19"

data:
  train_file: "data/train_dpo_v19.jsonl"
  max_length: 1024

training:
  num_epochs: 3
  per_device_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  lr_schedule: "linear"
  warmup_ratio: 0.10
  max_grad_norm: 1.0
  fp16: true
  beta: 0.1
  seed: 42

checkpointing:
  output_dir: "checkpoints/dpo-v19"
  save_every_n_steps: 50
  eval_strategy: "epoch"

logging:
  wandb_project: "neuralai-dpo"
  wandb_run_name: "135M-DPO-v19"
  tensorboard_dir: "logs/tensorboard/dpo"
  log_every_n_steps: 10

lora:
  r: 32
  lora_alpha: 64
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  lora_dropout: 0.0
  bias: "none"
  task_type: "CAUSAL_LM"
