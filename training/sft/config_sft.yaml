# NeuralAI-Air-135M SFT v19 Configuration

model:
  base_model_path: "checkpoints/pretrain/best"

data:
  train_file: "data/train_sft_v19.jsonl"
  max_length: 1024

training:
  num_epochs: 3
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  lr_schedule: "linear"
  warmup_ratio: 0.03
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-8
  max_grad_norm: 1.0
  fp16: true
  seed: 42

checkpointing:
  output_dir: "checkpoints/sft-v19"
  save_every_n_steps: 100
  eval_strategy: "epoch"

logging:
  wandb_project: "neuralai-sft"
  wandb_run_name: "135M-SFT-v19"
  tensorboard_dir: "logs/tensorboard/sft"
  log_every_n_steps: 10
